<!-- Blog Grid -->
<div class="space-y-8">
    <!-- Section Header -->
    <div class="flex items-center justify-between">
        <h2 class="text-2xl font-serif font-bold text-primary-900">All Posts</h2>
        <span class="text-sm text-gray-500">{{ blogPosts.length }} articles</span>
    </div>

    <!-- Blog Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <article *ngFor="let post of paginatedPosts" 
                 class="group bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-lg hover:border-accent/20 transition-all duration-300">
            <!-- Image -->
            <div class="relative overflow-hidden aspect-[16/10]">
                <img [src]="post.image" [alt]="post.title" 
                     class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                     loading="lazy">
                <!-- Category Badge -->
                <div class="absolute top-4 left-4">
                    <span *ngIf="post.category === 'Hackathon'" 
                          class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-500 text-white shadow-lg">
                        <i class="bi bi-trophy me-1"></i> {{ post.category }}
                    </span>
                    <span *ngIf="post.category === 'Travel & Nature'" 
                          class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-blue-500 text-white shadow-lg">
                        <i class="bi bi-tree me-1"></i> {{ post.category }}
                    </span>
                    <span *ngIf="post.category === 'Personal'" 
                          class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-purple-500 text-white shadow-lg">
                        <i class="bi bi-person-circle me-1"></i> {{ post.category }}
                    </span>
                </div>
            </div>
            
            <!-- Content -->
            <div class="p-5">
                <!-- Meta -->
                <div class="flex items-center gap-4 text-xs text-gray-400 mb-3">
                    <span class="flex items-center">
                        <i class="bi bi-calendar3 me-1.5"></i> {{ post.date }}
                    </span>
                    <span class="flex items-center">
                        <i class="bi bi-person me-1.5"></i> {{ post.author }}
                    </span>
                </div>
                
                <!-- Title -->
                <h3 class="text-lg font-semibold text-primary-900 mb-3 line-clamp-2 group-hover:text-accent transition-colors duration-200">
                    <a (click)="onClickBlog(post.slug)" class="cursor-pointer">{{ post.title }}</a>
                </h3>
                
                <!-- Description -->
                <p class="text-sm text-gray-500 line-clamp-2 mb-4 leading-relaxed">{{ post.description }}</p>
                
                <!-- Read More Button -->
                <button (click)="onClickBlog(post.slug)" 
                        class="inline-flex items-center text-sm font-medium text-accent hover:text-accent-600 transition-colors duration-200 group/btn">
                    Read Article
                    <i class="bi bi-arrow-right ms-2 group-hover/btn:translate-x-1 transition-transform duration-200"></i>
                </button>
            </div>
        </article>
    </div>
</div>

<!-- Pagination -->
<nav class="mt-12" *ngIf="totalPages > 1">
    <div class="flex items-center justify-center gap-2">
        <!-- Previous -->
        <button (click)="changePage(currentPage - 1)" 
                [disabled]="currentPage === 1"
                class="flex items-center justify-center w-10 h-10 rounded-lg border border-gray-200 bg-white text-gray-500 hover:bg-accent hover:border-accent hover:text-white disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-gray-200 disabled:hover:text-gray-500 transition-all duration-200">
            <i class="bi bi-chevron-left"></i>
        </button>
        
        <!-- Page Numbers -->
        <div class="flex items-center gap-1">
            <button *ngFor="let page of [].constructor(totalPages); let i = index"
                    (click)="changePage(i + 1)"
                    [class]="currentPage === i + 1 
                        ? 'w-10 h-10 rounded-lg bg-accent text-white font-medium shadow-lg shadow-accent/30' 
                        : 'w-10 h-10 rounded-lg border border-gray-200 bg-white text-gray-600 hover:bg-gray-50 transition-colors duration-200'">
                {{ i + 1 }}
            </button>
        </div>
        
        <!-- Next -->
        <button (click)="changePage(currentPage + 1)"
                [disabled]="currentPage === totalPages"
                class="flex items-center justify-center w-10 h-10 rounded-lg border border-gray-200 bg-white text-gray-500 hover:bg-accent hover:border-accent hover:text-white disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-gray-200 disabled:hover:text-gray-500 transition-all duration-200">
            <i class="bi bi-chevron-right"></i>
        </button>
    </div>
</nav>
