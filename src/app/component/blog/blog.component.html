<div class="row">
    <div class="col-md-6 mb-4" *ngFor="let post of paginatedPosts">
        <div class="blog-item">
            <img [src]="post.image" [alt]="post.title" class="img-fluid rounded-top" loading="lazy">
            <div class="blog-item-content p-4">
                <div class="mb-3">
                    <span class="text-muted">
                        <i class="bi bi-pencil-fill me-2"></i>{{ post.category }}
                    </span>
                </div>
                <h3 class="h4 mb-3">
                    <a (click)="onClickBlog(post.slug)" class="text-decoration-none text-dark">{{ post.title }}</a>
                </h3>
                <p class="text-muted">{{ post.description }}</p>
                <a (click)="onClickBlog(post.slug)" class="btn btn-primary btn-sm rounded-pill">Learn More</a>
            </div>
        </div>
    </div>
</div>
